<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curunír Workbench</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form" class="login-box" aria-label="Sign in">
    <h1>Curunír</h1>
    <p class="muted">Every conclusion here descends to captured evidence. Enter your actor token.</p>
    <label for="token">Actor token</label>
    <input id="token" type="password" autocomplete="off" autofocus>
    <div id="pilot-login" class="hidden">
      <label for="pilot-role">Pilot participant role</label>
      <select id="pilot-role">
        <option value="PRIMARY_OPERATOR">PRIMARY_OPERATOR</option>
        <option value="APPROVER">APPROVER</option>
        <option value="PUBLIC_ACCESS_CHECK">PUBLIC_ACCESS_CHECK</option>
      </select>
      <label for="pilot-note">Session note</label>
      <input id="pilot-note" type="text" placeholder="session note">
      <p class="muted">The session starts as you sign in, before anything else is read; a session already open for this role is resumed.</p>
    </div>
    <button type="submit">Sign in</button>
    <p id="login-error" class="error" role="alert"></p>
  </form>
</div>
<div id="shell" class="shell hidden">
  <nav id="nav" class="nav" aria-label="Workbench sections">
    <div class="brand">CURUNÍR<span class="brand-sub" id="actor-badge"></span></div>
    <input id="quick-search" type="search" placeholder="Search ( / )" aria-label="Search mission">
    <div id="nav-links"></div>
    <button id="logout" class="ghost">Sign out</button>
  </nav>
  <main id="main" class="main" tabindex="-1"></main>
  <aside id="inspector" class="inspector hidden" aria-label="Inspector"></aside>
</div>
<div class="auditor-flag">Auditor mode — identifiers visible</div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
